name: echomind_memory
version: 1.0.0
description: "A persistent memory system that lets your AI remember user preferences, tasks, knowledge, and self-learned experiences. Supports OpenClaw, Hermes, Claude Code, and OpenCode ecosystems."
author: "Your Name"
license: MIT
entry: main.py
category: memory
tags:
  - ai-memory
  - long-term-memory
  - rl-optimization
  - agent-enhancement
  - code-memory

tools:
  - name: retrieve_memory
    description: "Retrieve relevant memories based on user query and task context. Returns prioritized content to inject into LLM prompt."
    parameters:
      type: object
      properties:
        user_id:
          type: string
          description: "Unique identifier for the user. Required for personalized memory."
        query:
          type: string
          description: "The current user question or task request."
        task_id:
          type: string
          description: "Optional. ID of the ongoing task to continue from."
        max_results:
          type: integer
          default: 5
          description: "Maximum number of memories to return. Default: 5"
      required:
        - user_id
        - query
    returns:
      type: object
      properties:
        working_memory:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum: [user, knowledge, experience, task_progress, task_history, context, research]
              content:
                type: string
              importance:
                type: number
                format: float
              metadata:
                type: object
        confidence_score:
          type: number
          format: float
          description: "Overall confidence in memory relevance (0.0–1.0)"
        used_weights:
          type: object
          description: "Current importance weights used for retrieval (for debugging/audit)"
        feedback_requested:
          type: boolean
          description: "Whether you should ask the user for feedback on the response"
      required:
        - working_memory
        - confidence_score

  - name: store_memory
    description: "Store interaction results to persistent memory. Used after agent completes a task."
    parameters:
      type: object
      properties:
        user_id:
          type: string
          description: "User identifier"
        task_id:
          type: string
          description: "Task identifier for context"
        context:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant, system]
              content:
                type: string
        task_status:
          type: string
          enum: [completed, failed, pending]
        success:
          type: boolean
          description: "Whether the task was successfully completed"
        experience_summary:
          type: string
          description: "Optional. An LLM-generated summary of what was learned from this task."
      required:
        - user_id
        - task_id
        - context
        - task_status

  - name: record_feedback
    description: "Record user feedback (👍/👎) on a memory retrieval result to improve future performance."
    parameters:
      type: object
      properties:
        user_id:
          type: string
        task_id:
          type: string
        feedback:
          type: string
          enum: [positive, negative]
        retrieved_memories:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              content:
                type: string
              importance:
                type: number
              metadata:
                type: object
      required:
        - user_id
        - task_id
        - feedback
        - retrieved_memories

  - name: sync_code_memory
    description: "Syncs user preferences and coding experience to .echomind/ folder in project root. Enables Claude Code (Cursor) to remember your style and past fixes."
    parameters:
      type: object
      properties:
        project_root:
          type: string
          description: "Path to the project root directory (e.g., /home/user/my-project)"
        user_id:
          type: string
          description: "Unique ID of the user"
      required:
        - project_root
        - user_id
    returns:
      type: object
      properties:
        status:
          type: string
          enum: [synced, error]
        path:
          type: string
          description: "Path where files were written if synced"
        error:
          type: string
          description: "Error message if failed"

dependencies:
  - pydantic>=2.7
  - chromadb>=0.5
  - redis>=5.0
  - numpy>=1.26
  - python-dotenv>=1.0
  - asyncpg>=0.29

config_schema:
  type: object
  properties:
    postgres_url:
      type: string
      description: "PostgreSQL connection string"
      default: "postgresql://agent:agent123@localhost:5432/agent_memory"
    chroma_path:
      type: string
      description: "Path to ChromaDB persistent storage"
      default: "./echomind_chroma"
    redis_host:
      type: string
      description: "Redis server host"
      default: "localhost"
    redis_port:
      type: integer
      default: 6379
    enable_rl_optimizer:
      type: boolean
      description: "Whether to enable RL self-improvement"
      default: true
    max_context_tokens:
      type: integer
      default: 4096