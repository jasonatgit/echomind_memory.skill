name: echomind_memory
version: "1.2.12"
description: "A persistent memory system that lets your AI remember user preferences, tasks, knowledge, and self-learned experiences. Supports OpenClaw, Hermes, Claude Code, and OpenCode ecosystems."
author: "jasonatgit"
license: MIT
entry: main.py
category: memory
tags:
  - ai-memory
  - long-term-memory
  - rl-optimization
  - agent-enhancement
  - code-memory

tools:
  - name: retrieve_memory
    description: "Retrieve relevant memories based on user query and task context. Returns prioritized content to inject into LLM prompt. Covers 6 memory types: user, task, experience, context, knowledge, research."
    parameters:
      type: object
      properties:
        config_path:
          type: string
          description: "Optional. Path to config file (default: $ECHOMIND_CONFIG or ~/.echomind/echomind_config.yaml)"
        user_id:
          type: string
          description: "Unique identifier for the user. Required for personalized memory."
        query:
          type: string
          description: "The current user question or task request."
        task_id:
          type: string
          description: "Optional. ID of the ongoing task to continue from."
        platform:
          type: string
          description: "Optional. Platform identifier for memory isolation (e.g. 'hermes', 'openclaw', 'claude')."
        max_results:
          type: integer
          default: 5
          description: "Maximum number of memories to return. Default: 5"
        project:
          type: string
          default: "default"
          description: "Optional. Project identifier for memory isolation."
        session_id:
          type: string
          default: ""
          description: "Optional. Session identifier for context grouping."
        profile:
          type: string
          default: "default"
          description: "Optional. User profile for memory isolation."
      required:
        - user_id
        - query
    returns:
      type: object
      properties:
        working_memory:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum: [user, knowledge, experience, task_progress, task_history, context, research]
              content:
                type: string
              importance:
                type: number
                format: float
              metadata:
                type: object
        confidence_score:
          type: number
          format: float
          description: "Overall confidence in memory relevance (0.0–1.0)"
        used_weights:
          type: object
          description: "Current RL importance weights (persisted across restarts)"
        feedback_requested:
          type: boolean

  - name: store_memory
    description: "Store interaction results to persistent memory (6 types: user, task, experience, context, knowledge)."
    parameters:
      type: object
      properties:
        config_path:
          type: string
          description: "Optional. Path to config file (default: $ECHOMIND_CONFIG or ~/.echomind/echomind_config.yaml)"
        user_id:
          type: string
        task_id:
          type: string
        platform:
          type: string
          description: "Optional. Platform identifier for memory isolation."
        context:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant, system]
              content:
                type: string
        task_status:
          type: string
          enum: [completed, failed, pending]
        success:
          type: boolean
        experience_summary:
          type: string
        project:
          type: string
          default: "default"
          description: "Optional. Project identifier for memory isolation."
        session_id:
          type: string
          default: ""
          description: "Optional. Session identifier for context grouping."
        correction:
          type: boolean
          default: false
          description: "Optional. Set to true if the user is correcting the agent's previous response (triggers immediate reflection)."
        profile:
          type: string
          default: "default"
          description: "Optional. User profile for memory isolation."
      required:
        - user_id
        - task_id
        - context
        - task_status

  - name: record_feedback
    description: "Record user feedback (👍/👎) to improve future retrieval. RL weights are persisted to SQLite."
    parameters:
      type: object
      properties:
        config_path:
          type: string
          description: "Optional. Path to config file (default: $ECHOMIND_CONFIG or ~/.echomind/echomind_config.yaml)"
        user_id:
          type: string
        task_id:
          type: string
        feedback:
          type: string
          enum: [positive, negative]
        retrieved_memories:
          type: array
          items:
            type: object
        profile:
          type: string
          default: "default"
          description: "Optional. User profile for memory isolation."
      required:
        - user_id
        - task_id
        - feedback
        - retrieved_memories

  - name: sync_code_memory
    description: "Syncs user preferences and coding experience to .echomind/ folder in project root."
    parameters:
      type: object
      properties:
        config_path:
          type: string
          description: "Optional. Path to config file (default: $ECHOMIND_CONFIG or ~/.echomind/echomind_config.yaml)"
        project_root:
          type: string
        user_id:
          type: string
      required:
        - project_root
        - user_id

  - name: add_research_paper
    description: "Add a research paper to the knowledge base."
    parameters:
      type: object
      properties:
        config_path:
          type: string
          description: "Optional. Path to config file (default: $ECHOMIND_CONFIG or ~/.echomind/echomind_config.yaml)"
        title:
          type: string
        authors:
          type: array
          items:
            type: string
          description: "List of author names"
        year:
          type: integer
        journal:
          type: string
        abstract:
          type: string
        keywords:
          type: array
          items:
            type: string
        domain:
          type: string
          default: "general"
        paper_type:
          type: string
          enum: [theory, experiment, survey, case_study]
        key_points:
          type: array
          items:
            type: string
        importance_score:
          type: number
          default: 0.5
      required:
        - title

  - name: add_research_note
    description: "Add a research note linked to papers."
    parameters:
      type: object
      properties:
        config_path:
          type: string
          description: "Optional. Path to config file (default: $ECHOMIND_CONFIG or ~/.echomind/echomind_config.yaml)"
        user_id:
          type: string
        topic:
          type: string
        content:
          type: string
        linked_papers:
          type: array
          items:
            type: string
          description: "Paper IDs to link"
        tags:
          type: array
          items:
            type: string
      required:
        - user_id
        - topic
        - content

dependencies:
  - pydantic>=2.7
  - python-dotenv>=1.0
  - numpy>=1.26
  - PyYAML>=6.0
  - requests>=2.28
  - fastapi>=0.100
  - uvicorn>=0.20

config_schema:
  type: object
  properties:
    db_path:
      type: string
      description: "Path to SQLite database file"
      default: "~/.echomind/memory.db"
    enable_rl_optimizer:
      type: boolean
      description: "Whether to enable RL self-improvement"
      default: true
    max_context_tokens:
      type: integer
      default: 4096