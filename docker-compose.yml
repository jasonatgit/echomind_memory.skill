version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent123
    ports:
      - "5432:5432"
    volumes:
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - echomind-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - echomind-net

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    command: ["--persist_directory", "/data"]
    volumes:
      - ./echomind_chroma:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - echomind-net

networks:
  echomind-net:
    driver: bridge