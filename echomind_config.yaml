# echomind_config.yaml — EchoMind full configuration parameters
# Version: v1.2.0
#
# Distributed via GitHub as default config. Use directly or copy to ~/.echomind/ then modify.
# Priority: runtime ext_params > YAML overrides > built-in FALLBACK_CONFIG

version: 2

# Memory isolation — default project identifier
default_project: "default"

# Database path
db:
  path: "~/.echomind/memory.db"
  pragmas:
    - "journal_mode=WAL"
    - "synchronous=NORMAL"
    - "cache_size=-64000"
    - "busy_timeout=30000"

# RL self-optimization toggle
enable_rl_optimizer: true

# Context window size (number of conversation turns to retain)
max_context_tokens: 4096

rl:
  initial_weights:
    relevance: [0.30, 0.50]
  learning_rate: 0.07
  decay_factor: 0.97
  max_buffer_size: 50

reflection:
  batch_size: [5, 12]
  max_daily: [5, 20]

retrieval:
  experience_top_k: 5
  experience_min_success_rate_initial: 0.7
  experience_min_success_rate_final: 0.6
  experience_limit: 5
  research_top_k: 5
  context_limit: 2
  preference_score_boost: 0.2
  relevance_multiplier: 0.6
  recency_multiplier: 0.5

llm:
  # Provider mode: openai_compatible | ollama | none
  # openai_compatible: any OpenAI-compatible API (vLLM, Hermes, OpenAI, DeepSeek, etc.)
  # none: disable LLM, fall back to keyword matching
  provider: "openai_compatible"

  # OpenAI-compatible API endpoint (higher priority than host/port)
  endpoint: ""  # https://your-api.example.com/v1

  # Legacy compat: when endpoint is empty, auto-construct http://{host}:{port}/v1
  # host: "localhost"   # deprecated fallback, set endpoint directly
  # port: 9119          # deprecated fallback, set endpoint directly

  # API key (supports ${ENV_VAR} environment variable reference)
  api_key: "" # supports ${ENV_VAR}

  # Default model
  model: "local"
  temperature: 0.3
  max_tokens: 1500
  timeout: 60

  # Semantic retrieval model (can use a cheaper model to reduce costs)
  semantic_model: ""              # empty = reuse model
  semantic_temperature: 0
  semantic_max_tokens: 4          # only needs integer 0-10

server:
  host: "127.0.0.1"
  port: 8005
  api_key: "" # API Key auth (empty=skip) supports ${ECHOMIND_API_KEY} env var

inference:
  min_occurrence: 2
  strategy: "keyword"
  keywords:
    concise_response: ["brief","concise","简洁","简短","简要"]
    detailed_type: ["type hint","Optional[str]","详细","类型标注","文档先行"]
    concise_code: ["concise","no comments","简洁","不写注释","精简"]

# domain.keywords moved to domain_keywords.yaml (built-in default, distributed via GitHub)
# To customize, add a domain section here to override built-in values:
# domain:
#   keywords:
#     my_domain:
#       zh: ["自定义关键词"]
#       en: ["custom keyword"]

# Topic tag extraction — keyword to tag mapping
topic_keywords:
  coding:
    zh: ["代码", "编程", "函数", "bug", "模块", "重构"]
    en: ["code", "debug", "function", "refactor", "module"]
  infrastructure:
    zh: ["部署", "Docker", "服务器", "数据库", "网络", "配置"]
    en: ["deploy", "docker", "server", "database", "network", "config"]
  research:
    zh: ["论文", "研究", "实验", "文献", "综述", "分析"]
    en: ["paper", "research", "experiment", "literature", "analysis"]
  design:
    zh: ["设计", "UI", "UX", "架构", "界面", "原型"]
    en: ["design", "UI", "UX", "architecture", "prototype"]
  devops:
    zh: ["CI/CD", "GitHub", "自动化", "流水线", "测试", "监控"]
    en: ["CI", "CD", "GitHub", "automation", "pipeline", "testing", "monitor"]

