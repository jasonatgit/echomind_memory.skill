# echomind_config.yaml — EchoMind 全量可配置参数
# 版本: v1.1.6
#
# 此文件随 GitHub 分发，包含全部默认值。可直接使用或复制到 ~/.echomind/ 后修改。
# 配置优先级: 运行时扩展参数 > 本文件覆盖 > 内置 FALLBACK_CONFIG

version: 2

# 记忆隔离 — 默认项目标识
default_project: "default"

# 数据库路径
db:
  path: "~/.echomind/memory.db"
  pragmas:
    - "journal_mode=WAL"
    - "synchronous=NORMAL"
    - "cache_size=-64000"
    - "busy_timeout=30000"

# RL 自优化开关
enable_rl_optimizer: true

# 上下文窗口大小（对话记忆保留条数）
max_context_tokens: 4096

rl:
  initial_weights:
    relevance: [0.30, 0.50]
  learning_rate: 0.07
  decay_factor: 0.97
  max_buffer_size: 50

reflection:
  batch_size: [5, 12]
  max_daily: [5, 20]

retrieval:
  experience_top_k: 5
  experience_min_success_rate_initial: 0.7
  experience_min_success_rate_final: 0.6
  experience_limit: 5
  research_top_k: 5
  context_limit: 2
  preference_score_boost: 0.2
  relevance_multiplier: 0.6
  recency_multiplier: 0.5

llm:
  # 提供商模式: openai_compatible | ollama | none
  # openai_compatible: 任何 OpenAI 兼容 API（vLLM、Hermes、OpenAI、DeepSeek 等）
  # none: 禁用 LLM，回退到关键词匹配
  provider: "openai_compatible"

  # OpenAI 兼容 API 地址（优先级高于 host/port）
  endpoint: ""  # https://your-api.example.com/v1

  # 旧配置兼容：当 endpoint 为空时自动构造 http://{host}:{port}/v1
  # host: "localhost"   # 已废弃的回退值，请直接设置 endpoint
  # port: 9119          # 已废弃的回退值，请直接设置 endpoint

  # API 密钥（支持 ${ENV_VAR} 引用环境变量）
  api_key: "" # 支持 ${ENV_VAR}

  # 默认模型
  model: "local"
  temperature: 0.3
  max_tokens: 1500
  timeout: 60

  # 语义检索专用（可配更轻量的模型降低成本）
  semantic_model: ""              # 空 = 复用 model
  semantic_temperature: 0
  semantic_max_tokens: 4          # 只需 0-10 的整数

server:
  host: "127.0.0.1"
  port: 8005
  api_key: "" # API Key 认证（空=跳过认证）支持 ${ECHOMIND_API_KEY} 引用环境变量

inference:
  min_occurrence: 2
  strategy: "keyword"
  keywords:
    concise_response: ["简短","简洁"]
    detailed_type: ["type hint","Optional[str]"]
    concise_code: ["简洁","不要注释"]

# domain.keywords 已移至 domain_keywords.yaml（内置默认，随 GitHub 分发）
# 如需自定义，可在此添加 domain 段覆盖内置值：
# domain:
#   keywords:
#     my_domain:
#       zh: ["自定义关键词"]
#       en: ["custom keyword"]

# 话题标签提取 — 关键词到标签的映射
topic_keywords:
  coding:
    zh: ["代码", "编程", "函数", "bug", "模块", "重构"]
    en: ["code", "debug", "function", "refactor", "module"]
  infrastructure:
    zh: ["部署", "Docker", "服务器", "数据库", "网络", "配置"]
    en: ["deploy", "docker", "server", "database", "network", "config"]
  research:
    zh: ["论文", "研究", "实验", "文献", "综述", "分析"]
    en: ["paper", "research", "experiment", "literature", "analysis"]
  design:
    zh: ["设计", "UI", "UX", "架构", "界面", "原型"]
    en: ["design", "UI", "UX", "architecture", "prototype"]
  devops:
    zh: ["CI/CD", "GitHub", "自动化", "流水线", "测试", "监控"]
    en: ["CI", "CD", "GitHub", "automation", "pipeline", "testing", "monitor"]